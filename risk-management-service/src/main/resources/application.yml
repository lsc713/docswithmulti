server:
  port: 8083

spring:
  application:
    name: risk-management-service

  datasource:
    url: jdbc:mysql://localhost:3309/risk_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: risk
    password: risk
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000          # 풀에서 연결 획득 대기 (30s)
      initialization-fail-timeout: -1    # 시작 시 첫 연결 실패해도 재시도 (Docker DB 준비 대기)
      max-lifetime: 580000               # 580s — MySQL wait_timeout(28800s) 보다 충분히 짧음
      keepalive-time: 60000              # 60s마다 keepalive 쿼리로 연결 유지

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: risk-management-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  data:
    redis:
      host: localhost
      port: 6379

external:
  merchant-limit:
    base-url: http://localhost:8082

kafka:
  topic:
    merchant-limit-updated: merchant.limit.updated

risk:
  # daily_limit 3단 해석(Redis 캐시 → DB 스냅샷 → merchant-limit HTTP) 실험 토글.
  # 앞 단계를 꺼서 각 층 비용을 실측한다. 기본 ON(현행). 부하테스트 시 env 로 오버라이드.
  #   A(기준): 둘 다 true          B: cache=false          C: cache=false+snapshot=false(HTTP 매번)
  limit:
    cache:
      enabled: ${RISK_LIMIT_CACHE_ENABLED:true}
    snapshot:
      enabled: ${RISK_LIMIT_SNAPSHOT_ENABLED:true}

resilience4j:
  circuitbreaker:
    instances:
      merchant-limit:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        ignore-exceptions:
          - com.example.riskmanagement.application.exception.MerchantCancelLimitNotFoundException

logging:
  level:
    com.example.riskmanagement: INFO

# 부하 실측 지표 노출 (Micrometer → /actuator/prometheus)
# resilience4j-spring-boot3 사용 → 서킷브레이커 메트릭 자동 등록
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true   # risk→merchant-limit 홉 지연 p95 (histogram_quantile용 _bucket)
