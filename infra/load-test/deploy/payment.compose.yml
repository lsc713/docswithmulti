# payment-service — payment 호스트(10.0.1.20)에서 실행
#   IMAGE_NS=<dockerhub-user> docker compose -f payment.compose.yml pull && up -d
#   이미지는 CI(loadtest-images.yml)가 Docker Hub 에 빌드/push. 호스트는 pull 만.
# host network: 10.0.1.20:8080 로 바로 바인딩 (prometheus scrape, k6 타깃)

services:
  payment-service:
    image: ${IMAGE_NS:?Docker Hub 네임스페이스(IMAGE_NS) 필요}/cancel-loadtest:payment-${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: payment-service
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://10.0.1.30:3306/payment_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      SPRING_DATA_REDIS_HOST: 10.0.1.40
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "10.0.1.40:9092"
      EXTERNAL_RISK_MANAGEMENT_URL: "http://10.0.1.21:8083"
      JAVA_TOOL_OPTIONS: "-Xmx4g -XX:+UseG1GC ${OTEL_JAVAAGENT:-}"
      OTEL_SERVICE_NAME: "payment"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://10.0.1.50:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_always_on}"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      LOADTEST_QUERYCOUNT_ENABLED: "${LOADTEST_QUERYCOUNT_ENABLED:-false}"
