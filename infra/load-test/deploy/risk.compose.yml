# risk-management-service — risk 호스트(10.0.1.21)에서 실행
#   IMAGE_NS=<dockerhub-user> docker compose -f risk.compose.yml pull && up -d

services:
  risk-management-service:
    image: ${IMAGE_NS:?Docker Hub 네임스페이스(IMAGE_NS) 필요}/cancel-loadtest:risk-management-${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: risk-management-service
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://10.0.1.31:3306/risk_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: risk
      SPRING_DATASOURCE_PASSWORD: risk
      SPRING_DATA_REDIS_HOST: 10.0.1.40
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "10.0.1.40:9092"
      EXTERNAL_MERCHANT_LIMIT_BASE_URL: "http://10.0.1.22:8082"
      JAVA_TOOL_OPTIONS: "-Xmx4g -XX:+UseG1GC ${OTEL_JAVAAGENT:-}"
      OTEL_SERVICE_NAME: "risk"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://10.0.1.50:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_always_on}"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      LOADTEST_QUERYCOUNT_ENABLED: "${LOADTEST_QUERYCOUNT_ENABLED:-false}"
      # Tomcat 스레드 지표(tomcat_threads_busy/config_max) opt-in — 포화 진단 런에서만 true
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "${SERVER_TOMCAT_MBEANREGISTRY_ENABLED:-false}"
      # daily_limit 해석 층 실험 토글 (기본 ON). env 오버라이드 후 --force-recreate:
      #   B(캐시 OFF → DB 스냅샷):        RISK_LIMIT_CACHE_ENABLED=false
      #   C(캐시+스냅샷 OFF → HTTP 매번):  RISK_LIMIT_CACHE_ENABLED=false RISK_LIMIT_SNAPSHOT_ENABLED=false
      RISK_LIMIT_CACHE_ENABLED: "${RISK_LIMIT_CACHE_ENABLED:-true}"
      RISK_LIMIT_SNAPSHOT_ENABLED: "${RISK_LIMIT_SNAPSHOT_ENABLED:-true}"
