# Strimzi Kafka 3-broker (KRaft) + 토픽 4개.
# 토픽명은 앱 application.yml과 정확히 일치(대소문자 포함) — metadata.name은 소문자,
# 실제 토픽명은 spec.topicName으로 지정(payment.cancelled.DLQ 대문자 대응).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: cancel-kafka
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 10Gi
    class: local-path
    deleteClaim: true
  template:
    pod:
      affinity:
        podAntiAffinity:                    # 브로커 노드당 1개로 분산
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/pool-name: broker
              topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: cancel-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payment-cancelled
  namespace: kafka
  labels: { strimzi.io/cluster: cancel-kafka }
spec:
  topicName: payment.cancelled
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payment-cancelled-retry
  namespace: kafka
  labels: { strimzi.io/cluster: cancel-kafka }
spec:
  topicName: payment.cancelled.retry
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: payment-cancelled-dlq
  namespace: kafka
  labels: { strimzi.io/cluster: cancel-kafka }
spec:
  topicName: payment.cancelled.DLQ          # 대문자 — 앱 order application.yml과 일치
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: merchant-limit-updated
  namespace: kafka
  labels: { strimzi.io/cluster: cancel-kafka }
spec:
  topicName: merchant.limit.updated
  partitions: 3
  replicas: 3
