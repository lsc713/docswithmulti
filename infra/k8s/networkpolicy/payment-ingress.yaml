apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: payment-allow-gateway, namespace: default }
spec:
  # 대상: payment 파드. api-gateway와 고아 예약을 조회하는 product-service만 8080 인그레스 허용.
  # 직접 도달(신뢰 헤더 X-User-Role 스푸핑 벡터) 차단(DEPLOY-02, T-04-07).
  # k3s 기본 flannel + 내장 NetworkPolicy controller가 실제 강제.
  # egress 미지정 — default-deny 미도입이므로 gateway→payment egress는 이미 허용(최소 정책).
  podSelector: { matchLabels: { app: payment } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: api-gateway } }
        - podSelector: { matchLabels: { app: product-service } }
      ports:
        - { protocol: TCP, port: 8080 }
