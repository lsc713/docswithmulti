apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: default }
data:
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  # payment/risk/merchant-limit는 SPRING_KAFKA_..., order는 KAFKA_BOOTSTRAP_SERVERS(둘 다 제공)
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "cancel-kafka-kafka-bootstrap.kafka.svc:9092"
  KAFKA_BOOTSTRAP_SERVERS: "cancel-kafka-kafka-bootstrap.kafka.svc:9092"
  EXTERNAL_RISK_MANAGEMENT_URL: "http://risk:8083"
  EXTERNAL_MERCHANT_LIMIT_BASE_URL: "http://merchant-limit:8082"
  EXTERNAL_ORDER_SERVICE_URL: "http://order:8081"
  EXTERNAL_PRODUCT_SERVICE_URL: "http://product-service:8084"
  PAYMENT_SERVICE_URL: "http://payment:8080"
  # api-gateway downstream 라우팅(D-P4-6). Deployment env로도 직접 주입되나 배포 설정 단일 출처 유지.
  GATEWAY_DOWNSTREAM_PAYMENT_URI: "http://payment:8080"
  GATEWAY_DOWNSTREAM_USER_URI: "http://user-service:8085"
  GATEWAY_DOWNSTREAM_ORDER_URI: "http://order:8081"
  GATEWAY_DOWNSTREAM_PRODUCT_URI: "http://product-service:8084"
  CANCEL_PUBLISH_MODE: "INLINE"
  # 외부 MySQL(고정 사설IP) — DB만 클러스터 밖. order_db는 cold-db:3307(merchant_db=3306).
  PAYMENT_DB_URL: "jdbc:mysql://10.0.1.30:3306/payment_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
  RISK_DB_URL: "jdbc:mysql://10.0.1.31:3306/risk_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
  MERCHANT_DB_URL: "jdbc:mysql://10.0.1.32:3306/merchant_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
  ORDER_DB_URL: "jdbc:mysql://10.0.1.32:3307/order_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
  # user_db는 payment 노드(10.0.1.30)에 스키마 추가(D-P4-3). 다른 노드 배치 시 이 host만 조정(calibration knob).
  USER_DB_URL: "jdbc:mysql://10.0.1.30:3306/user_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
---
apiVersion: v1
kind: Secret
metadata: { name: db-cred, namespace: default }
type: Opaque
stringData:
  PAYMENT_DB_USER: "payment"
  PAYMENT_DB_PASS: "payment"
  RISK_DB_USER: "risk"
  RISK_DB_PASS: "risk"
  MERCHANT_DB_USER: "merchant"
  MERCHANT_DB_PASS: "merchant"
  ORDER_DB_USER: "order_user"
  ORDER_DB_PASS: "order"
  # user-service 전용 계정(local 기본값 user/user와 일치). db-cred는 서비스별 개별 계정.
  USER_DB_USER: "user"
  USER_DB_PASS: "user"
