apiVersion: apps/v1
kind: Deployment
metadata: { name: order, namespace: default }
spec:
  replicas: 2
  selector: { matchLabels: { app: order } }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata: { labels: { app: order } }
    spec:
      containers:
        - name: order
          image: camelia9999/cancel-loadtest:order-latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8081 }]
          # order는 KAFKA_BOOTSTRAP_SERVERS(SPRING_ 접두 없음)를 쓰며 envFrom이 ConfigMap에서 주입.
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: SPRING_DATASOURCE_URL, valueFrom: { configMapKeyRef: { name: app-config, key: ORDER_DB_URL } } }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: db-cred, key: ORDER_DB_USER } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: db-cred, key: ORDER_DB_PASS } } }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx2g -XX:+UseG1GC" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata: { name: order, namespace: default }
spec:
  selector: { app: order }
  ports: [{ port: 8081, targetPort: 8081 }]
