// order-service build configuration

apply plugin: 'org.flywaydb.flyway'

flyway {
    url      = 'jdbc:mysql://localhost:3307/order_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    user     = 'order_user'
    password = 'order'
    locations = ['classpath:db/migration']
}

dependencies {
    implementation project(':common-observability')

    implementation 'org.springframework.kafka:spring-kafka'

    // Redisson (분산락) — cancel-restore 재구동 스케줄러 단일 실행 보장. product/payment 좌표 정렬(4.3.1).
    implementation 'org.redisson:redisson-spring-boot-starter:4.3.1'

    // Testcontainers Kafka (order-leg 수렴 e2e) — product/payment 정렬 버전
    testImplementation 'org.testcontainers:kafka:1.19.7'
}
