// order-service build configuration

apply plugin: 'org.flywaydb.flyway'

flyway {
    url      = 'jdbc:mysql://localhost:3307/order_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    user     = 'order_user'
    password = 'order'
    locations = ['classpath:db/migration']
}

dependencies {
    implementation 'org.springframework.kafka:spring-kafka'

    // Circuit Breaker
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
}
