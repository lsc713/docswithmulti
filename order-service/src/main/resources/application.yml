server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3307/order_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: order_user
    password: order
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000          # 풀에서 연결 획득 대기 (30s)
      initialization-fail-timeout: -1    # 시작 시 첫 연결 실패해도 재시도 (Docker DB 준비 대기)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      group-id: order-service
      retry-group-id: order-service-retry

kafka:
  topic:
    payment-cancelled: payment.cancelled
    payment-cancelled-retry: payment.cancelled.retry
    payment-cancelled-dlq: payment.cancelled.DLQ

# 부하 실측 지표 노출 (Micrometer → /actuator/prometheus)
# order-service Kafka consumer lag 은 kafka-exporter 로 별도 수집
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
