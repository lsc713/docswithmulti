spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3315/user_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: user
    password: user
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  profiles:
    active: local

server:
  port: 8085

jwt:
  # D-P1-3: 하드코딩 dev 기본값 제거. 비-local 프로파일에서 JWT_SECRET 미주입 시 바인딩 실패(fail-fast).
  # dev 기본값은 아래 local 프로파일 문서에만 둔다.
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

auth:
  cookie:
    secure: true      # dev localhost도 Chrome은 secure context 허용. HTTP-only 로컬 브라우저면 false.
    domain: ""        # 호스트 전용(비움). 프로덕션 도메인 분리 시 설정.

app:
  admin:
    # 첫 ADMIN 부트스트랩 — 콤마구분 이메일 목록(env: APP_ADMIN_BOOTSTRAP_EMAILS). 기본 비움(부트스트랩 비활성).
    bootstrap-emails: ""

logging:
  level:
    com.example.user: INFO

---
spring:
  config:
    activate:
      on-profile: local

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
