spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3310/product_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: product
    password: product
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      enable-auto-commit: false
  profiles:
    active: local
server:
  port: 8084
jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
kafka:
  topic:
    payment-cancelled: payment.cancelled
logging:
  level:
    com.example.product: INFO
