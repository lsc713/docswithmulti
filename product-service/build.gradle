// product-service build configuration

apply plugin: 'org.flywaydb.flyway'

flyway {
    url      = 'jdbc:mysql://localhost:3310/product_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    user     = 'product'
    password = 'product'
    locations = ['classpath:db/migration']
}

dependencies {
    implementation project(':common-observability')

    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // Kafka consumer (payment.cancelled 구독 → 재고 복원). 03-01: consume-only.
    implementation 'org.springframework.kafka:spring-kafka'

    // Redisson (분산락) — orphan 예약 복구 스케줄러 단일 실행 보장. payment-service 좌표 정렬(4.3.1).
    implementation 'org.redisson:redisson-spring-boot-starter:4.3.1'

    // Testcontainers Kafka (재고 복원 e2e) — order/payment 정렬 버전
    testImplementation 'org.testcontainers:kafka:1.19.7'

    // AWS SDK v2 S3 (MinIO 호환) — 상품 이미지 presigned PUT/GET
    implementation 'software.amazon.awssdk:s3:2.28.16'
}
