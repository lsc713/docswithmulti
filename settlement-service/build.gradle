// settlement-service build configuration (Phase 1: consume-only, no producer/scheduler/Redisson)

apply plugin: 'org.flywaydb.flyway'

flyway {
    url      = 'jdbc:mysql://localhost:3316/settlement_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    user     = 'settlement'
    password = 'settlement'
    locations = ['classpath:db/migration']
}

dependencies {
    // Kafka consumer (payment.cancelled 구독 → 정산 원장 적재).
    implementation 'org.springframework.kafka:spring-kafka'

    // Redisson (분산락) — reconcile 스케줄러 단일 실행 보장. product/payment 좌표 정렬(4.3.1).
    // (RestTemplate 은 root build.gradle 의 spring-boot-starter-web 에서 제공 — 별도 HTTP dep 불요.)
    implementation 'org.redisson:redisson-spring-boot-starter:4.3.1'

    // Testcontainers Kafka (컨슈머 e2e) — 다른 모듈 정렬 버전
    testImplementation 'org.testcontainers:kafka:1.19.7'
}
