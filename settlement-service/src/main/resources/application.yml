server:
  port: 8086
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  application:
    name: settlement-service

  datasource:
    url: jdbc:mysql://localhost:3316/settlement_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: settlement
    password: settlement
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      group-id: settlement-service          # NEW consumer group → payment.cancelled fan-out (payment diff 0)

kafka:
  topic:
    payment-cancelled: payment.cancelled
    payment-completed: payment.completed

logging:
  level:
    com.example.settlement: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
