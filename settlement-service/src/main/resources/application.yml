server:
  port: 8086
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  application:
    name: settlement-service

  datasource:
    url: jdbc:mysql://localhost:3316/settlement_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: settlement
    password: settlement
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      group-id: settlement-service          # NEW consumer group → payment.cancelled fan-out (payment diff 0)

  data:
    redis:                                  # reconcile 스케줄러 Redisson 분산락 (product 정렬)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

kafka:
  topic:
    payment-cancelled: payment.cancelled
    payment-completed: payment.completed

external:
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8080}   # reconcile HTTP pull 대상 (payment 8080)

scheduler:
  lock:
    settlement-reconcile: lock:scheduler:settlement-reconcile
    payout-poll: lock:scheduler:payout-poll          # poll backstop 분산락(reconcile 와 별개 키)

settlement:
  reconcile:
    grace-days: 1                           # 주마감 유예: period_end < today(KST) − grace 만 finalize 대상

payout:
  webhook:
    secret: ${PAYOUT_WEBHOOK_SECRET:local-dev-secret}   # env 주입(운영). 리터럴은 non-prod 부팅용 placeholder(CLAUDE.md 시크릿 금지)
  bank:
    url: ${PAYOUT_BANK_URL:http://localhost:9099}       # !local BankTransferHttpClient stub 대상
  poll:
    grace-seconds: 60                       # PROCESSING updated_at < now-grace 만 poll 대상

logging:
  level:
    com.example.settlement: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
