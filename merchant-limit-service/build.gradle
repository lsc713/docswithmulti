// merchant-limit-service build configuration

apply plugin: 'org.flywaydb.flyway'
apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.12'
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = false
    }
}

flyway {
    url      = 'jdbc:mysql://localhost:3308/merchant_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    user     = 'merchant'
    password = 'merchant'
    locations = ['classpath:db/migration']
}

dependencies {
    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Redis (분산락)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}
