// merchant-limit-service build configuration

apply plugin: 'org.flywaydb.flyway'
apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.12'
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = false
    }
}

flyway {
    url      = 'jdbc:mysql://localhost:3308/merchant_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    user     = 'merchant'
    password = 'merchant'
    locations = ['classpath:db/migration']
}

dependencies {
    implementation project(':common-observability')

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Redis 분산락 — payment 스케줄러와 동일한 Redisson RLock 사용
    implementation 'org.redisson:redisson-spring-boot-starter:4.3.1'
}
