// payment-service build configuration

apply plugin: 'org.flywaydb.flyway'
apply plugin: 'jacoco'

flyway {
    url      = 'jdbc:mysql://localhost:3311/payment_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    user     = 'payment'
    password = 'payment'
    locations = ['classpath:db/migration']
}

jacoco {
    toolVersion = '0.8.12'
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
        xml.required = false
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value   = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

dependencies {
    // Circuit Breaker
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'

    // Kafka (Outbox 발행)
    implementation 'org.springframework.kafka:spring-kafka'

    // Redisson (분산락) — Spring Boot 4.x / Spring Framework 7.x 호환
    implementation 'org.redisson:redisson-spring-boot-starter:4.3.1'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Test — Spring Security
    testImplementation 'org.springframework.security:spring-security-test'
}
