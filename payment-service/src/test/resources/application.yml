spring:
  application:
    name: payment-service

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:29092

external:
  # 통합테스트는 HTTP 포트를 mock/MockRestServiceServer로 가로챈다 — 더미 URL로 @Value 해소만.
  risk-management:
    url: http://localhost:8083
  pg:
    url: http://localhost:443
  product-service:
    url: http://localhost:8084

kafka:
  topic:
    payment-cancelled: payment.cancelled

cancel:
  outbox:
    poll-ms: 10000
    batch-size: 1000

scheduler:
  lock:
    failed-kafka-publisher: lock:scheduler:failed-kafka-publisher
    pending-recovery: lock:scheduler:pending-recovery
    processing-recovery: lock:scheduler:processing-recovery
    compensation-retry: lock:scheduler:compensation-retry
    stock-release-retry: lock:scheduler:stock-release-retry
    cancel-outbox-publisher: lock:scheduler:cancel-outbox-publisher
    cancel-outbox-purge: lock:scheduler:cancel-outbox-purge

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    com.example.payment: DEBUG
    org.hibernate.SQL: DEBUG
