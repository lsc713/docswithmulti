spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3311/payment_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: payment
    password: payment
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000          # 풀에서 연결 획득 대기 (30s)
      initialization-fail-timeout: -1    # 시작 시 첫 연결 실패해도 재시도 (Docker DB 준비 대기)

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  profiles:
    active: local

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

external:
  risk-management:
#    url: http://risk-management-service:8083
    url: http://localhost:8083
  pg:
    url: http://pg-gateway:443

logging:
  level:
    com.example.payment: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

kafka:
  topic:
    payment-cancelled: payment.cancelled

scheduler:
  lock:
    outbox-publisher: lock:scheduler:outbox-publisher
    pending-recovery: lock:scheduler:pending-recovery
    processing-recovery: lock:scheduler:processing-recovery
    compensation-retry: lock:scheduler:compensation-retry
