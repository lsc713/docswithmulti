spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3311/payment_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: payment
    password: payment
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000          # 풀에서 연결 획득 대기 (30s)
      initialization-fail-timeout: -1    # 시작 시 첫 연결 실패해도 재시도 (Docker DB 준비 대기)

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  profiles:
    active: local

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  shutdown: graceful

external:
  risk-management:
#    url: http://risk-management-service:8083
    url: http://localhost:8083
  pg:
    url: http://pg-gateway:443
  product-service:
#    url: http://product-service:8084   # 컨테이너 호스트 대안
    url: http://localhost:8084

logging:
  level:
    com.example.payment: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

kafka:
  topic:
    payment-cancelled: payment.cancelled

cancel:
  publish:
    mode: ${CANCEL_PUBLISH_MODE:OUTBOX}   # INLINE | INLINE_ASYNC | OUTBOX
  outbox:
    poll-ms: ${CANCEL_OUTBOX_POLL_MS:10000}
    batch-size: ${CANCEL_OUTBOX_BATCH_SIZE:1000}
    max-retries: ${CANCEL_OUTBOX_MAX_RETRIES:10}
    retention-days: ${CANCEL_OUTBOX_RETENTION_DAYS:7}
    datasource:
      hikari:
        maximum-pool-size: 2
        connection-timeout: 5000

scheduler:
  lock:
    pending-recovery: lock:scheduler:pending-recovery
    processing-recovery: lock:scheduler:processing-recovery
    compensation-retry: lock:scheduler:compensation-retry
    cancel-outbox-publisher: lock:scheduler:cancel-outbox-publisher
    cancel-outbox-purge: lock:scheduler:cancel-outbox-purge

# 부하 실측 지표 노출 (Micrometer → /actuator/prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # p95/p99 히스토그램 버킷 생성
        http.client.requests: true   # payment→risk/PG 홉 지연 p95 (histogram_quantile용 _bucket)
