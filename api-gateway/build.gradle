// api-gateway: 무상태 서블릿 MVC 게이트웨이 (D-P2-1/D-P2-6).
// 루트 subprojects{}가 java/boot/dependency-management 플러그인과 공통 의존성(web/jpa/flyway/mysql/
// actuator/lombok/test)을 이미 주입 → 여기서 재선언 금지. Spring Cloud BOM + 게이트웨이/jjwt만 추가.
// spring-boot-starter-security 추가 금지 (D-P2-2 — JWT 게이트는 Security 필터체인 아님).

dependencyManagement {
    imports {
        // A1 calibration knob: BOM 2025.1.2는 Boot 4.0.7 기준. 프로젝트 Boot 4.0.5 핀.
        // :api-gateway:build 실패가 spring-cloud↔boot 아티팩트 충돌이면 루트 Boot 안 올리고
        // 이 BOM을 4.0.5에 맞는 2025.1.x patch(2025.1.1/2025.1.0)로 하향 (RESEARCH VERDICT knob b).
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'  // 버전 BOM 관리 → 5.0.x

    // JWT verify-only. user-service와 동일 jjwt 라인 (계약 미러)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 통합테스트: downstream 스텁
    testImplementation 'org.wiremock:wiremock-standalone:3.9.2'
}
